<svg viewBox="0 0 920 420" role="img" aria-label="Animated flanged pipe joint being assembled">
            <defs>
              <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#F6F8F9" />
                <stop offset=".45" stop-color="#C7D0D6" />
                <stop offset=".55" stop-color="#E9EEF1" />
                <stop offset="1" stop-color="#9EA9B1" />
              </linearGradient>
              <linearGradient id="steelv" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#B5C0C7" />
                <stop offset=".5" stop-color="#EEF2F4" />
                <stop offset="1" stop-color="#A7B2B9" />
              </linearGradient>
              <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8E99A1" />
                <stop offset=".5" stop-color="#DCE2E6" />
                <stop offset="1" stop-color="#6E7982" />
              </linearGradient>
              <pattern id="thread" width="6" height="14" patternUnits="userSpaceOnUse">
                <rect width="6" height="14" fill="url(#bolt)" />
                <path d="M0 0L6 14" stroke="#6E7982" stroke-width="1" opacity=".6" />
              </pattern>
              <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0E8178" flood-opacity=".18" />
              </filter>
            </defs>
            <ellipse cx="460" cy="372" rx="380" ry="10" fill="#0E8178" opacity=".07" />
            <g filter="url(#shadow)">
              <g id="gL">
                <rect x="-20" y="160" width="380" height="100" fill="url(#steel)" />
                <polygon points="360,160 400,138 400,282 360,260" fill="url(#steel)" />
                <rect x="400" y="78" width="46" height="264" rx="4" fill="url(#steelv)" stroke="#9EA9B1" />
                <rect x="446" y="146" width="6" height="128" fill="#C7D0D6" stroke="#9EA9B1" />
              </g>
              <g id="gR">
                <rect x="562" y="160" width="380" height="100" fill="url(#steel)" />
                <polygon points="562,160 522,138 522,282 562,260" fill="url(#steel)" />
                <rect x="476" y="78" width="46" height="264" rx="4" fill="url(#steelv)" stroke="#9EA9B1" />
                <rect x="470" y="146" width="6" height="128" fill="#C7D0D6" stroke="#9EA9B1" />
              </g>
              <g id="gG">
                <rect x="452" y="128" width="18" height="164" rx="3" fill="#0E8178" />
                <rect x="456" y="146" width="10" height="128" fill="#2BB39F" />
                <g stroke="#BFE6DF" stroke-width="1.2">
                  <line x1="456" y1="152" x2="466" y2="160" />
                  <line x1="456" y1="170" x2="466" y2="178" />
                  <line x1="456" y1="188" x2="466" y2="196" />
                  <line x1="456" y1="206" x2="466" y2="214" />
                  <line x1="456" y1="224" x2="466" y2="232" />
                  <line x1="456" y1="242" x2="466" y2="250" />
                  <line x1="456" y1="260" x2="466" y2="268" />
                </g>
              </g>
              <g id="gB">
                <rect x="366" y="96" width="190" height="14" rx="3" fill="url(#thread)" />
                <rect x="366" y="310" width="190" height="14" rx="3" fill="url(#thread)" />
              </g>
              <g id="gN">
                <g class="nut" style="transform-origin:389px 103px">
                  <rect x="378" y="86" width="22" height="34" rx="3" fill="#5F6B74" />
                  <rect x="378" y="98" width="22" height="10" fill="#7C8891" />
                </g>
                <g class="nut" style="transform-origin:533px 103px">
                  <rect x="522" y="86" width="22" height="34" rx="3" fill="#5F6B74" />
                  <rect x="522" y="98" width="22" height="10" fill="#7C8891" />
                </g>
                <g class="nut" style="transform-origin:389px 317px">
                  <rect x="378" y="300" width="22" height="34" rx="3" fill="#5F6B74" />
                  <rect x="378" y="312" width="22" height="10" fill="#7C8891" />
                </g>
                <g class="nut" style="transform-origin:533px 317px">
                  <rect x="522" y="300" width="22" height="34" rx="3" fill="#5F6B74" />
                  <rect x="522" y="312" width="22" height="10" fill="#7C8891" />
                </g>
              </g>
            </g>
            <g id="flow" opacity="0">
              <rect x="-20" y="196" width="960" height="28" rx="14" fill="#2BB39F" opacity=".18" />
              <line x1="-20" y1="210" x2="940" y2="210" stroke="#0E8178" stroke-width="6" stroke-dasharray="30 22"
                stroke-linecap="round">
                <animate attributeName="stroke-dashoffset" from="0" to="-104" dur="1s" repeatCount="indefinite" />
              </line>
            </g>
            <!-- labels: gL/gG/gB labels are moved with their parts in JS -->
            <g class="lb" id="lb1" opacity="0">
              <path class="lead" d="M423 78 V38 H300" />
              <circle cx="423" cy="78" r="4" fill="#0E8178" /><text class="lab" x="292" y="43" text-anchor="end"
                id="t_l1">Weld neck flange</text>
            </g>
            <g class="lb" id="lb2" opacity="0">
              <path class="lead" d="M461 128 V20 H560" />
              <circle cx="461" cy="128" r="4" fill="#0E8178" /><text class="lab" x="568" y="25" id="t_l2">Spiral wound
                gasket</text>
            </g>
            <g class="lb" id="lb3" opacity="0">
              <path class="lead" d="M460 324 V390 H600" />
              <circle cx="460" cy="324" r="4" fill="#0E8178" /><text class="lab" x="608" y="395" id="t_l3">Stud
                bolt</text>
            </g>
            <g class="lb" id="lb4" opacity="0">
              <path class="lead" d="M389 334 V390 H280" />
              <circle cx="389" cy="334" r="4" fill="#0E8178" /><text class="lab" x="272" y="395" text-anchor="end"
                id="t_l4">Heavy hex nut</text>
            </g>
            <g id="seal" opacity="0">
              <rect x="150" y="290" width="112" height="38" rx="19" fill="#0E8178" /><text class="sealed" x="206"
                y="315" text-anchor="middle" id="t_seal">Sealed</text>
            </g>
          </svg>